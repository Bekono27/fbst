<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аурант ажиллах орчин</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4ff;color:#142b50;font:15px system-ui,sans-serif}
header{background:#102e65;color:#fff;padding:20px max(5vw,20px);font-size:18px;font-weight:750}
main{max-width:1180px;margin:auto;padding:28px 20px 48px}
.hero{background:linear-gradient(120deg,#123477,#245ac3);color:#fff;border-radius:20px;padding:clamp(22px,5vw,48px)}
h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.05em;margin:0}
.hero p{color:#e1edff;margin:8px 0 0}
.toolbar,.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
button,select,input,textarea{font:inherit;padding:10px 13px;border:1px solid #b6ccef;border-radius:9px;background:#fff;color:#17396d}
button{cursor:pointer;font-weight:600}
button:hover{background:#e5efff}
button.primary{background:#2155bd;border-color:#2155bd;color:white}
button.primary:hover{background:#153d92}
:focus-visible{outline:3px solid #518aff;outline-offset:2px}
.panel{border:1px solid #cbdcf5;border-radius:15px;background:#fff;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #e6eefc}
th{background:#dce9ff;font-size:13px}
tbody tr:nth-child(even){background:#f6f9ff}
td:first-child{font-weight:650}
small{display:block;color:#46638b;font-weight:400}
dialog{border:1px solid #b6ccef;border-radius:16px;width:min(510px,94vw);color:#142b50}
dialog::backdrop{background:#10234daa}
label.field{display:grid;gap:4px;margin:10px 0}
textarea{min-height:75px}

body{background:#282a27;color:#e9e7df;font-family:"Instrument Sans",system-ui,sans-serif}
header{background:#191b19;border-bottom:1px solid #383b35;color:#e9e7df;letter-spacing:.14em;font-size:13px}
.hero{background:linear-gradient(120deg,#20221f,#464840);border:1px solid #53564d;border-radius:16px}
.hero p,small{color:#c3c5b9}
button,select,input,textarea{background:#30332e;color:#eeeae1;border-color:#64685b}
button:hover{background:#43473e}
button.primary{background:#c9d2b3;border-color:#c9d2b3;color:#22281c}
button.primary:hover{background:#dce3cd}
:focus-visible{outline-color:#c9d2b3}
.panel{background:#30322e;border-color:#52564b}
th{background:#383b35;color:#e2e4d7}
th,td{border-bottom-color:#46493f}
tbody tr:nth-child(even){background:#343730}
dialog{background:#282b26;color:#eeeae1;border-color:#666b5d}
dialog::backdrop{background:#11130fd9}
.metrics{display:flex;flex-wrap:wrap;gap:24px;margin-top:22px}
.metrics span{display:grid;gap:3px;color:#c3c5b9;font-size:13px}
.metrics strong{font-size:24px;color:#f3f1e9}
#notice{color:#c3c5b9}
@media(max-width:580px){main{padding:16px 12px}.filters>*{width:100%}.toolbar>*{flex:1 1 auto}}
</style><header>АУРАНТ / УДИРДЛАГА</header><main>
<section class="hero"><h1>Бүртгэлийн удирдлага</h1><p>Бүртгэл, хуудас болон танилцуулгаа нэг дор удирдаарай.</p><div class="metrics"><span><strong id="account-count">0</strong>Бүртгэл</span><span><strong id="portfolio-count">0</strong>Идэвхтэй багц</span></div></section>
<div class="toolbar"><button class="primary" id="add">Бүртгэл нэмэх</button><button hidden id="seed">Жишээ бүртгэл нэмэх</button><button id="upload">CSV оруулах</button><input id="file" type="file" accept=".csv" hidden><button id="bio-bank">Танилцуулгын сан</button><button id="export">CSV татах</button></div>
<div class="filters"><input id="search" aria-label="Нэрээр хайх" placeholder="Нэрээр хайх"><select id="portfolio" aria-label="Багцаар шүүх"><option value="">Бүх багц</option></select></div>
<button id="reset-filters" type="button">Шүүлтүүр арилгах</button><p id="notice" role="status"></p><div class="panel"><table><thead><tr><th>Харагдах нэр</th><th>Багц</th><th>Төлөв</th><th>Хуудасны дугаар / холбоос</th><th>Үйлдэл</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><dialog id="editor"><form id="form"><h2 id="heading">Бүртгэлийн мэдээлэл</h2>
<label class="field">Харагдах нэр<input name="name" required></label><label class="field">Латин бичлэг<input name="latin"></label><label class="field">Багц<select name="portfolio"></select></label><label class="field">Ангилал<input name="category" required></label><label class="field">Танилцуулга<textarea name="bio"></textarea></label><button type="button" id="random-bio">Санамсаргүй танилцуулга</button><label class="field">Нүүр зураг<input id="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><img id="preview" alt="Зургийн харагдац" width="72" height="72" hidden><button type="button" id="remove-photo">Зураг арилгах</button><label class="field">Төлөв<select name="status"><option value="Draft">Ноорог</option><option value="Rehearsed">Дотоод туршилт</option><option value="Recorded externally">Дугаар бүртгэсэн</option><option value="Mock Page created">Дотоод туршилт</option></select></label><label class="field">Хуудасны дугаар<input name="pageId"></label><label class="field">Хуудасны холбоос<input name="url" type="url"></label>
<div class="toolbar"><button type="button" id="cancel">Болих</button><button hidden type="button" id="rehearse">Rehearse creation</button><button hidden type="button" id="create-page">Create mock Page</button><button class="primary">Хадгалах</button></div></form></dialog>
<dialog id="bio-editor"><form id="bio-form"><h2>Танилцуулгын сан</h2><label class="field">Мөр бүрд нэг танилцуулга<textarea id="bio-lines" rows="8" maxlength="20000"></textarea></label><div class="toolbar"><button type="button" id="bio-cancel">Болих</button><button class="primary">Танилцуулгуудыг хадгалах</button></div></form></dialog>
<script>
const get = id => document.getElementById(id);
const fields = ['name','latin','portfolio','category','bio','status','pageId','url','mockPageId'];
const portfolios = ['Portfolio 1','Portfolio 2','Portfolio 3','Portfolio 4'];
const statuses = ['Draft','Rehearsed','Recorded externally','Mock Page created'];
const form = get('form'), editor = get('editor');
let drafts = JSON.parse(localStorage.getItem('user-workspace-v1') || '[]'), editing, photo, photoRead;
for (const portfolio of portfolios) {
  get('portfolio').add(new Option(portfolio));
  form.elements.portfolio.add(new Option(portfolio));
}
function render(message) {
  const query = get('search').value.trim().toLocaleLowerCase();
  const portfolio = get('portfolio').value;
  const visible = drafts.filter(d => (!portfolio || d.portfolio === portfolio) && (d.name+' '+d.latin).toLocaleLowerCase().includes(query));
  get('account-count').textContent = drafts.length;
  get('portfolio-count').textContent = new Set(drafts.map(draft => draft.portfolio)).size;
  get('notice').textContent = message || visible.length+' харагдаж байна / '+drafts.length+' бүртгэл';
  get('rows').replaceChildren();
  if (!visible.length) {
    const cell = get('rows').insertRow().insertCell();
    cell.colSpan = 5;
    cell.textContent = drafts.length ? 'Шүүлтүүрт тохирох бүртгэл алга.' : 'Бүртгэл нэмэх эсвэл CSV файлаас оруулна уу.';
  }
  for (const draft of visible) {
    const row = get('rows').insertRow();
    const name = row.insertCell();
    if (draft.photo) {
      const avatar = document.createElement('img');
      avatar.src = draft.photo;
      avatar.alt = '';
      avatar.width = avatar.height = 32;
      avatar.style.cssText = 'border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px';
      name.append(avatar);
    }
    name.append(document.createTextNode(draft.name));
    const latin = document.createElement('small');
    latin.textContent = draft.latin;
    name.append(latin);
    for (const value of [draft.portfolio,({Draft:'Ноорог',Rehearsed:'Дотоод туршилт','Recorded externally':'Дугаар бүртгэсэн','Mock Page created':'Дотоод туршилт'})[draft.status] || draft.status,[draft.pageId,draft.url].filter(Boolean).join(' / ') || '—']) row.insertCell().textContent = value;
    const button = document.createElement('button');
    button.textContent = 'Засах';
    button.onclick = () => openDraft(draft);
    row.insertCell().append(button);
  }
}
function commit(next, message) {
  try { localStorage.setItem('user-workspace-v1', JSON.stringify(next)); }
  catch { render('Хадгалж чадсангүй. Хөтчийн хадгалах зайг шалгана уу.'); return false; }
  drafts = next;
  render(message);
  return true;
}
function openDraft(draft) {
  editing = draft;
  const values = draft ? {...draft, category:draft.category === 'General' ? 'Хувийн блог' : draft.category} : {portfolio:get('portfolio').value || portfolios[0],category:'Хувийн блог',status:'Draft'};
  for (const field of fields) if (form.elements[field]) form.elements[field].value = values[field] || '';
  photoRead = null;
  setPhoto(draft?.photo || '');
  get('photo').value = '';
  get('rehearse').textContent = draft?.status === 'Rehearsed' ? 'Rehearse update' : 'Rehearse creation';
  get('create-page').textContent = draft?.mockPageId ? 'Update mock Page' : 'Create mock Page';
  editor.showModal();
}
function setPhoto(value) {
  photo = value;
  const preview = get('preview');
  preview.hidden = !value;
  if (value) preview.src = value;
  else preview.removeAttribute('src');
}
get('photo').onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type) || file.size > 250000) {
    event.target.value = '';
    return alert('250 КБ-аас бага PNG, JPEG, WebP эсвэл GIF зураг сонгоно уу.');
  }
  const reader = new FileReader();
  photoRead = reader;
  reader.onload = () => {
    if (photoRead !== reader) return;
    photoRead = null;
    setPhoto(reader.result);
  };
  reader.onerror = () => {
    if (photoRead !== reader) return;
    photoRead = null;
    alert('Сонгосон зургийг уншиж чадсангүй.');
  };
  reader.readAsDataURL(file);
};
get('remove-photo').onclick = () => {
  photoRead = null;
  get('photo').value = '';
  setPhoto('');
};
const bioKey = 'user-workspace-bios-v1';
const previousDefaultBios = ['Collects postcards and keeps a weekend scrapbook.', 'Photographs stations and writes short travel notes.', 'Repairs old radios and shares progress photos.', 'Sketches city architecture in a pocket notebook.', 'Tracks good cycling routes and shares tips for beginners.'];
const defaultBios = [
  'Хөдөө явах дуртай', 'Ээжийн цай хамгийн амттай', 'Өглөө эрт босдог',
  'Гэртээ ном унших дуртай', 'Ууланд алхах сайхан', 'Өдөр бүр хөгжим сонсдог',
  'Найзуудтайгаа уулзах дуртай', 'Намрын өнгөнд дуртай', 'Гэрийн хоол хамгийн сайхан',
  'Голын эрэг дээр суух дуртай', 'Бороотой өдөр цай ууна', 'Аавтайгаа загасанд явдаг',
  'Цонхоор цас харах сайхан', 'Хашаандаа цэцэг тарьдаг', 'Орой болгон алхдаг',
  'Эмээгийн хийсэн боорцгонд дуртай', 'Амралтаараа нутаг руугаа явдаг',
  'Өглөөний нарыг харах дуртай', 'Хуучны дуу сонсох дуртай',
  'Салхи сэвэлзэх сайхан', 'Удаан алхаж бодлоо цэгцэлдэг',
  'Амралтын өдөр эрт босдоггүй', 'Хааяа хуучин зургаа үздэг',
  'Нохойтойгоо орой салхинд гардаг'
];
const savedBios = JSON.parse(localStorage.getItem(bioKey) || 'null');
let bios = savedBios === null || JSON.stringify(savedBios) === JSON.stringify(previousDefaultBios)
  ? defaultBios : savedBios.filter(bio => !/[a-zA-Z]/.test(bio));
if (!bios.length) bios = defaultBios;
get('bio-bank').onclick = () => {
  get('bio-lines').value = bios.join('\n');
  get('bio-editor').showModal();
};
get('bio-cancel').onclick = () => get('bio-editor').close();
get('bio-form').onsubmit = event => {
  event.preventDefault();
  const next = [...new Set(get('bio-lines').value.split(/\r?\n/).map(line => line.trim()).filter(Boolean))];
  if (next.some(bio => /[a-zA-Z]/.test(bio) || bio.split(/\s+/).length < 3 || bio.split(/\s+/).length > 8 || bio.length > 100)) return alert('Танилцуулга нь монгол хэлээр 3–8 үгтэй, 100 тэмдэгтээс богино байна.');
  if (next.length > 100) return alert('100 хүртэл танилцуулга хадгална.');
  try { localStorage.setItem(bioKey, JSON.stringify(next)); }
  catch { return alert('Танилцуулгын санг хадгалж чадсангүй.'); }
  bios = next;
  get('bio-editor').close();
  render(bios.length+' танилцуулга байна.');
};
get('random-bio').onclick = () => {
  const field = form.elements.bio;
  const choices = bios.filter(bio => bio !== field.value);
  if (!bios.length) return alert('Танилцуулгын санд эхлээд өгүүлбэр нэмнэ үү.');
  if (choices.length) field.value = choices[Math.floor(Math.random()*choices.length)];
};
function save(rehearse, createPage = false) {
  if (photoRead) return alert('Зураг ачаалж дуусахыг хүлээнэ үү.');
  if (!form.reportValidity()) return;
  const values = Object.fromEntries(fields.map(field => [field,(form.elements[field]?.value || '').trim()]));
  values.photo = photo;
  if (editing?.mockPageId) values.mockPageId = editing.mockPageId;
  if (values.bio && (/[a-zA-Z]/.test(values.bio) || values.bio.split(/\s+/).length < 3 || values.bio.split(/\s+/).length > 8 || values.bio.length > 100)) return alert('Танилцуулгаа монгол хэлээр 3–8 үгтэй бичнэ үү.');
  if (values.pageId && (!/^\d+$/.test(values.pageId) || drafts.some(draft => draft !== editing && draft.pageId === values.pageId))) return alert('Хуудасны дугаар зөвхөн цифрээс бүрдэх бөгөөд давхардаж болохгүй.');
  if (!values.name || !values.category) return alert('Нэр болон ангиллаа оруулна уу.');
  if (createPage) {
    const action = values.mockPageId ? 'Update' : 'Create';
    if (!confirm([action+' mock Page locally?',values.name,values.portfolio,values.category,values.bio || 'No bio'].join('\n'))) return;
    values.mockPageId ||= 'mock-'+Array.from(crypto.getRandomValues(new Uint8Array(12)), byte => byte.toString(16).padStart(2,'0')).join('');
    values.status = 'Mock Page created';
  }
  if (rehearse) {
    if (values.status === 'Recorded externally') return alert('This profile is already recorded externally.');
    const action = editing?.status === 'Rehearsed' ? 'Update' : 'Create';
    const name = editing && editing.name !== values.name ? editing.name+' → '+values.name : values.name;
    if (!confirm([action+' mock user',name,values.portfolio,values.category,values.bio || 'No bio',photo ? 'Profile photo selected' : 'No profile photo'].join('\n'))) return;
    values.status = 'Rehearsed';
  }
  if (values.status === 'Recorded externally' && !values.pageId && !values.url) return alert('Хуудасны дугаар эсвэл холбоос оруулна уу.');
  const next = editing ? drafts.map(draft => draft === editing ? values : draft) : [...drafts,values];
  if (commit(next,rehearse ? 'Rehearsal recorded locally.' : undefined)) editor.close();
}
form.onsubmit = event => { event.preventDefault(); save(false); };
get('rehearse').onclick = () => save(true);
get('create-page').onclick = () => save(false,true);
get('cancel').onclick = () => editor.close();
get('add').onclick = () => openDraft();
get('search').oninput = () => render();
get('portfolio').onchange = () => render();
get('reset-filters').onclick = () => {
  get('search').value = '';
  get('portfolio').value = '';
  render();
};

const first = ['Бат|Bat','Наран|Naran','Саруул|Saruul','Тэмүүлэн|Temuulen','Мөнх|Munkh','Ариун|Ariun','Болор|Bolor','Уянга|Uyanga','Энх|Enkh','Хулан|Khulan'];
const last = ['Эрдэнэ|Erdene','Туяа|Tuya','Баяр|Bayar','Сүрэн|Suren','Дорж|Dorj','Чулуун|Chuluun','Алтан|Altan','Од|Od','Гэрэл|Gerel','Сайхан|Saikhan','Төгс|Tugs','Билэг|Bileg','Дөл|Dul','Заяа|Zayaa','Хишиг|Khishig','Цэцэг|Tsetseg','Тэнгэр|Tenger','Сондор|Sondor','Далай|Dalai','Оргил|Orgil'];
const nicknames = ['Batuka','Batuna','Naraa','Saraa','Temka','Muuji','Ari','Bolo','Uyaa','Khula'];
function chooseBio() {
  return defaultBios[Math.floor(Math.random() * defaultBios.length)];
}
const activities = ['collects old street maps','repairs vintage radios','draws city skylines','photographs railway stations','collects postcards','keeps a weather journal','restores old bicycles','makes short travel videos','catalogs used books','sketches local architecture'];
const details = ['and shares weekend discoveries','and keeps a monthly scrapbook','and writes short field notes','and hosts a small hobby meetup','and posts a photo diary','and keeps a list of favorite spots','and shares tips for beginners','and saves progress photos','and plans a new project each month','and documents the tools used','and trades finds with friends','and shares one update every Friday','and keeps an illustrated notebook','and records a short audio diary','and organizes a seasonal swap','and logs experiments as they happen','and makes simple guides','and tracks new finds on a map','and puts together themed albums','and writes a monthly recap'];
const previousGeneratedBios = new Set(activities.flatMap(activity =>
  details.map(detail => 'Mock profile that '+activity+' '+detail+'.')
));
let migrated = false;
const refreshed = drafts.map(draft => {
  if (!/[a-zA-Z]/.test(draft.bio || '')) return draft;
  migrated = true;
  return {...draft, bio: chooseBio()};
});
if (migrated) commit(refreshed);
get('seed').onclick = () => {
  const samples = first.flatMap((given,i) => last.map((family,j) => {
    const [a,b] = given.split('|'), [c,d] = family.split('|');
    const variant = j%5;
    const name = variant === 0 ? a+' '+c : variant === 1 ? b+' '+d : variant === 2 ? a+' '+d : variant === 3 ? b+' '+c : j === 4 ? nicknames[i] : nicknames[i]+' '+d;
    return {name,latin:name === b+' '+d ? '' : b+' '+d,portfolio:portfolios[j%4],category:'Хувийн блог',bio:chooseBio(),status:'Draft',pageId:'',url:''};
  }));
  const existing = new Set(drafts.map(d => d.name));
  const added = samples.filter(d => !existing.has(d.name));
  commit([...drafts,...added],added.length+' mock users added.');
};
function parseCSV(source) {
  const records = [];
  const token = /(?:"((?:[^"]|"")*)"|([^",\r\n]*))(,|\r\n|\r|\n|$)/y;
  const text = source.replace(/^\uFEFF/,'');
  let row = [], cursor = 0;
  while (cursor < text.length) {
    token.lastIndex = cursor;
    const match = token.exec(text);
    if (!match || token.lastIndex === cursor) throw Error('Invalid CSV near character '+(cursor+1));
    cursor = token.lastIndex;
    row.push(match[1] === undefined ? match[2] : match[1].replaceAll('""','"'));
    if (match[3] !== ',') { records.push(row); row = []; }
  }
  if (row.length) records.push([...row,'']);
  return records;
}
get('upload').onclick = () => get('file').click();
get('file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const [header,...records] = parseCSV(await file.text());
    const requiredFields = fields.filter(field => field !== 'mockPageId');
    if (!header || new Set(header).size !== header.length || !header.every(field => fields.includes(field)) || !requiredFields.every(field => header.includes(field))) throw Error('Татсан CSV файлын баганын нэрийг ашиглана уу.');
    const imported = records.filter(row => row.some(Boolean)).map(row => {
      if (row.length !== header.length) throw Error('Нэг мөрийн баганын тоо буруу байна.');
      const draft = Object.fromEntries(header.map((field,i) => [field,row[i].trim()]));
      if (!draft.name || !draft.category || !portfolios.includes(draft.portfolio) || !statuses.includes(draft.status)) throw Error('Check name, category, portfolio and status for '+(draft.name || 'an unnamed row')+'.');
      if (draft.status === 'Recorded externally' && !draft.url && !draft.pageId) throw Error('Нийтэлсэн бүртгэлд дугаар эсвэл холбоос шаардлагатай.');
      if (draft.url && !/^https?:\/\/[^\s]+$/i.test(draft.url)) throw Error('Invalid profile URL for '+draft.name+'.');
      return draft;
    });
    commit([...drafts,...imported],imported.length+' бүртгэл орууллаа.');
  } catch (error) { render(error.message); }
};
get('export').onclick = () => {
  const quote = value => '"'+value.replaceAll('"','""')+'"';
  const csv = [fields.join(','),...drafts.map(d => fields.map(field => quote(d[field] || '')).join(','))].join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'users.csv';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};
render();
</script></html>
